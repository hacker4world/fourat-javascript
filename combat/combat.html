<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="health-container">
      <input type="range" id="enemy-health" min="0" max="10000" />
    </div>
    <h2 id="enemy-name">Renoir</h2>

    <div class="skills">
      <img
        id="skill1"
        class="skill"
        src="./images/verso/assault_zero.png"
        alt=""
      />
      <img
        id="skill2"
        class="skill"
        src="./images/verso/from_fire.png"
        alt=""
      />
      <img
        id="skill3"
        class="skill"
        src="./images/verso/phantom_stars.png"
        alt=""
      />
    </div>

    <div class="characters-container">
      <div class="characters">
        <img
          id="verso"
          class="character"
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTSkp_yLztINwPHSHFgCF8sp76PENpOMUxdVJCzuyWcmg&s=10"
          alt=""
        />
        <img
          id="maelle"
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTmfKeUGZtiofGhq_ylxJwXLPRezbCgvJctpS0hvOW1-w&s"
          alt=""
          class="character"
        />
      </div>
    </div>
    <p id="ap1">veroso Ap: 2</p>
    <p id="ap2">maelle Ap: 2</p>
    <script src="./script.js"></script>
  </body>
</html>
